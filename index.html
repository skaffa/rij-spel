<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rij-Spel: Zwarte Cross Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'Arial Black', sans-serif;
            background-color: #f4ebd0; 
            color: #332314;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 10px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 85vh;
            background-color: #fff;
            border: 4px solid #332314;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 0 #332314;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 70%, #dfb76c 70%, #dfb76c 100%);
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 12px;
            border: 2px solid #332314;
            border-radius: 6px;
            box-shadow: 2px 2px 0 #332314;
        }
        #screen-start, #screen-gameover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(244, 235, 208, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        #screen-gameover {
            display: none;
        }
        h1 {
            font-size: 28px;
            color: #d9534f;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 #332314;
            -webkit-text-stroke: 1px #332314;
        }
        p {
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .btn {
            background-color: #5cb85c;
            color: white;
            border: 3px solid #332314;
            padding: 12px 24px;
            font-size: 18px;
            font-family: 'Arial Black', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #332314;
            pointer-events: auto;
            text-transform: uppercase;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #332314;
        }
        .beer-container {
            margin-top: 25px;
            background: #fff;
            border: 3px solid #332314;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 3px 3px 0 #332314;
            pointer-events: auto;
            max-width: 90%;
        }
        .beer-text {
            font-size: 12px;
            color: #332314;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .beer-btn {
            display: inline-block;
            background-color: #f0ad4e;
            color: #332314;
            text-decoration: none;
            border: 2px solid #332314;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 3px 0 #332314;
        }
        .beer-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #332314;
        }
        .hint {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div class="score-board">
                <div>PUNTEN: <span id="score">0</span></div>
                <div>RECORDRYDER: <span id="highscore">0</span></div>
            </div>
        </div>

        <div id="screen-start">
            <h1>RIJ SPEL</h1>
            <p>Spring met je KTM over de kratten. Pak de flesjes voor bonuspunten (+5)!</p>
            <button class="btn" id="start-btn">GAS EROP!</button>
        </div>

        <div id="screen-gameover">
            <h1>CRASH!</h1>
            <p>Score: <span id="final-score">0</span> punten!</p>
            <button class="btn" id="restart-btn">NOG EEN KEER</button>

            <div class="beer-container">
                <p class="beer-text">"Highscore gehaald? Sla overmorgen die rij over en gun de maker een koud biertje." 🍻</p>
                <a href="#" id="beer-link" target="_blank" class="beer-btn">👉 TRAKTEER EEN BIERTJE 👈</a>
                <div class="hint">(Opent in nieuw tabblad)</div>
            </div>
        </div>
    </div>

    <script>
        // --- AFBEELDINGEN INLADEN ---
        const imgMotor = new Image(); imgMotor.src = 'ktm.png';
        const imgCrate = new Image(); imgCrate.src = 'grolsch.png';
        const imgBottle = new Image(); imgBottle.src = 'fles.png';

        // --- DYNAMISCHE TIKKIE LOGICA ---
        const tikkieLinks = {
            'shirt': 'https://tikkie.me/YOUR_SHIRT_LINK_HERE',
            'sticker': 'https://tikkie.me/YOUR_STICKER_LINK_HERE'
        };
        const urlParams = new URLSearchParams(window.location.search);
        const source = urlParams.get('source') || 'shirt'; 
        const beerLinkEl = document.getElementById('beer-link');
        beerLinkEl.href = tikkieLinks[source] || tikkieLinks['shirt'];

        // --- SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

        // --- GAME LOGICA ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('screen-start');
        const gameOverScreen = document.getElementById('screen-gameover');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const finalScoreEl = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');


        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        resize();

        let gameState = 'START'; 
        let score = 0;
        let highscore = localStorage.getItem('zc_highscore_v3') || 0;
        highscoreEl.textContent = highscore;

        const gravity = 0.6;
        const groundHeight = 0.3; 
        
        // Entiteiten
        let obstacles = [];
        let bottles = [];
        let particles = [];
        let spawnTimer = 0;
        let gameSpeed = 5;
        let frameCount = 0; // Voor sinus animaties

        const player = {
            x: 40,
            y: 0,
            vy: 0,
            width: 70, // Breedte van de motor PNG
            height: 45, // Hoogte van de motor PNG
            angle: 0,
            isJumping: false,
            init() {
                this.y = canvas.height * (1 - groundHeight) - this.height;
                this.vy = 0;
                this.angle = 0;
                this.isJumping = false;
            },
            jump() {
                if (!this.isJumping) {
                    this.vy = -12;
                    this.isJumping = true;
                }
            },
            update() {
                this.vy += gravity;
                this.y += this.vy;
                
                const groundY = canvas.height * (1 - groundHeight) - this.height;
                if (this.y >= groundY) {
                    this.y = groundY;
                    this.vy = 0;
                    this.isJumping = false;
                    this.angle += (0 - this.angle) * 0.2; // Roteer soepel terug naar 0
                } else {
                    // Motor kantelt in de lucht (omhoog is naar achter, naar beneden is naar voren)
                    let targetAngle = this.vy * 0.04; 
                    this.angle += (targetAngle - this.angle) * 0.15;
                }

                // Rook particles toevoegen bij de uitlaat (links onderaan de hitbox)
                if (frameCount % 3 === 0) {
                    particles.push({
                        x: this.x,
                        y: this.y + this.height - 10,
                        vx: -1 - Math.random() * 2,
                        vy: -Math.random(),
                        alpha: 0.6,
                        size: 3 + Math.random() * 6
                    });
                }
            },
            draw() {
                ctx.save();
                // Verplaats het draaipunt naar het midden van de motor
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.angle);
                
                if (imgMotor.complete && imgMotor.naturalHeight !== 0) {
                    ctx.drawImage(imgMotor, -this.width / 2, -this.height / 2, this.width, this.height);
                } else {
                    // Fallback als motor nog laadt
                    ctx.fillStyle = "black";
                    ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                }
                ctx.restore();
            }
        };

        function spawnEntities() {
            const crateSize = 35; // Formaat per Grolsch kratje
            const stackCount = Math.floor(Math.random() * 3) + 1; // 1, 2 of 3 hoog
            const groundY = canvas.height * (1 - groundHeight);
            
            // Krat toevoegen
            obstacles.push({
                x: canvas.width + 50,
                y: groundY - (crateSize * stackCount), // Y van de bovenste krat
                width: crateSize,
                height: crateSize * stackCount,
                stackCount: stackCount,
                passed: false
            });

            // Af en toe een flesje spawnen (niet tegelijk op dezelfde x als een krat om het eerlijk te houden, of juist hoog in de lucht)
            if (Math.random() > 0.6) {
                bottles.push({
                    x: canvas.width + 200 + Math.random() * 150,
                    baseY: groundY - 120 - Math.random() * 80, // Hoog in de lucht
                    y: 0,
                    width: 15,
                    height: 45,
                    active: true
                });
            }
        }

        function resetGame() {
            score = 0;
            gameSpeed = 5.5;
            obstacles = [];
            bottles = [];
            particles = [];
            spawnTimer = 0;
            scoreEl.textContent = score;
            player.init();
        }

        function startGame() {
            gameState = 'PLAYING';
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            resetGame();
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            finalScoreEl.textContent = score;
            if (score > highscore) {
                highscore = score;
                localStorage.setItem('zc_highscore_v3', highscore);
                highscoreEl.textContent = highscore;
            }
            gameOverScreen.style.display = 'flex';
        }

        function checkCollision(r1, r2, padding = 5) {
            return (
                r1.x < r2.x + r2.width - padding &&
                r1.x + r1.width - padding > r2.x &&
                r1.y < r2.y + r2.height - padding &&
                r1.y + r1.height - padding > r2.y
            );
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCount++;

            // Achtergrond tekenen
            const horizon = canvas.height * (1 - groundHeight);
            ctx.fillStyle = '#87CEEB'; 
            ctx.fillRect(0, 0, canvas.width, horizon);
            ctx.fillStyle = '#dfb76c'; 
            ctx.fillRect(0, horizon, canvas.width, canvas.height * groundHeight);
            
            ctx.strokeStyle = '#332314';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, horizon);
            ctx.lineTo(canvas.width, horizon);
            ctx.stroke();

            if (gameState === 'PLAYING') {
                player.update();
                gameSpeed += 0.002;

                spawnTimer++;
                const spawnInterval = Math.max(50, 100 - Math.floor(gameSpeed * 3));
                if (spawnTimer > spawnInterval) {
                    spawnEntities();
                    spawnTimer = 0;
                }

                // Teken & Update Particles (Rook)
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx - gameSpeed; // Beweegt mee met de achtergrond
                    p.y += p.vy;
                    p.alpha -= 0.02;
                    p.size += 0.1;

                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                    } else {
                        ctx.save();
                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.fillStyle = '#888';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // Teken & Update Flesjes (Collectibles)
                for (let i = bottles.length - 1; i >= 0; i--) {
                    let bottle = bottles[i];
                    bottle.x -= gameSpeed;
                    
                    // Zweef animatie met sinus
                    bottle.y = bottle.baseY + Math.sin(frameCount * 0.1 + i) * 10;

                    if (bottle.active) {
                        if (imgBottle.complete && imgBottle.naturalHeight !== 0) {
                            ctx.drawImage(imgBottle, bottle.x, bottle.y, bottle.width, bottle.height);
                        } else {
                            ctx.fillStyle = "green";
                            ctx.fillRect(bottle.x, bottle.y, bottle.width, bottle.height);
                        }

                        // Botsing met flesje = pakken
                        if (checkCollision(player, bottle, -5)) {
                            bottle.active = false; // Flesje is gepakt
                            score += 5;
                            scoreEl.textContent = score;
                            
                            // Teken even een +5 tekst (visuele feedback)
                            ctx.fillStyle = '#5cb85c';
                            ctx.font = '24px Arial Black';
                            ctx.fillText('+5', player.x + 30, player.y - 20);
                        }
                    }

                    if (bottle.x < -50) bottles.splice(i, 1);
                }

                // Teken & Update Kratten (Obstakels)
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.x -= gameSpeed;

                    // Teken gestapelde kratten
                    let crateHeight = obs.height / obs.stackCount;
                    for(let j = 0; j < obs.stackCount; j++) {
                        let drawY = obs.y + (j * crateHeight);
                        if (imgCrate.complete && imgCrate.naturalHeight !== 0) {
                            ctx.drawImage(imgCrate, obs.x, drawY, obs.width, crateHeight);
                        } else {
                            ctx.fillStyle = "brown";
                            ctx.fillRect(obs.x, drawY, obs.width, crateHeight);
                            ctx.strokeRect(obs.x, drawY, obs.width, crateHeight);
                        }
                    }

                    // Botsing check
                    if (checkCollision(player, obs, 8)) {
                        triggerGameOver();
                    }

                    // Punt erbij
                    if (!obs.passed && obs.x + obs.width < player.x) {
                        obs.passed = true;
                        score++;
                        scoreEl.textContent = score;
                    }

                    if (obs.x < -100) obstacles.splice(i, 1);
                }
            }

            player.draw();
            requestAnimationFrame(loop);
        }

        // Controls
        window.addEventListener('touchstart', (e) => {
            if (gameState === 'PLAYING') player.jump();
        }, { passive: false });

        window.addEventListener('mousedown', () => {
            if (gameState === 'PLAYING') player.jump();
        });

        startBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
        restartBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

        player.init();
        requestAnimationFrame(loop);
        window.addEventListener('resize', resize);
    </script>
</body>
</html>
